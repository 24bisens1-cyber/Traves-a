services:
  travesia:
    build: .
    ports:
      - "5000:5000"
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      COOKIE_SECURE: "0"
      CITYPULSEX_TRUST_PROXY: "0"
      CITYPULSEX_DB: /app/instance/citypulsex.sqlite3
    volumes:
      - travesia-data:/app/instance
    restart: unless-stopped
volumes:
  travesia-data:
